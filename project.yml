name: ReaderApp

options:
  bundleIdPrefix: com.local.reader
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic

schemes:
  ReaderApp:
    build:
      targets:
        ReaderApp: all
    test:
      targets:
        - ReaderAppTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

targets:
  ReaderApp:
    type: application
    platform: iOS
    sources:
      - path: ReaderApp
        excludes:
          - "Info.plist"
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: SwiftSoup
        product: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.reader.app
        PRODUCT_NAME: ReaderApp
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ReaderApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: ReaderApp/ReaderApp.entitlements
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: ReaderApp/Info.plist
      properties:
        CFBundleDisplayName: "本地阅读器"
        CFBundleName: "本地阅读器"
        CFBundleShortVersionString: "1.26.2"
        CFBundleVersion: "56"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        # 书源可能落在 http 站点，放开 ATS（纯个人本地工具，不上架）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleDocumentTypes:
          # 兜底：任何文件都能「拷贝到本地阅读器」（微信/QQ 分享文件时才会出现这个 App）
          - CFBundleTypeName: "任意文件"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: ["public.data"]
          - CFBundleTypeName: "纯文本"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions: ["txt", "text"]
            LSItemContentTypes: ["public.plain-text"]
          - CFBundleTypeName: "EPUB 电子书"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            CFBundleTypeExtensions: ["epub"]
            LSItemContentTypes: ["org.idpf.epub-container"]
          - CFBundleTypeName: "PDF 文档"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions: ["pdf"]
            LSItemContentTypes: ["com.adobe.pdf"]
          - CFBundleTypeName: "漫画压缩包"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            CFBundleTypeExtensions: ["cbz", "cbr", "zip"]
            LSItemContentTypes: ["public.zip-archive", "com.local.reader.cbz"]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: "com.local.reader.cbz"
            UTTypeDescription: "漫画压缩包"
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension: ["cbz"]

  ReaderAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReaderAppTests
    dependencies:
      - target: ReaderApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.reader.tests
        PRODUCT_NAME: ReaderAppTests

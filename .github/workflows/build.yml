name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          SIM_NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro| Pro Max| Plus)?' | head -1)
          echo "Testing on simulator: $SIM_NAME"
          xcodebuild test \
            -project ReaderApp.xcodeproj \
            -scheme ReaderApp \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ReaderApp.xcodeproj \
            -scheme ReaderApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ReaderApp.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ReaderApp.xcarchive/Products/Applications/ReaderApp.app build/Payload/
          cd build
          zip -qry ReaderApp-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ReaderApp-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReaderApp-unsigned-ipa
          path: build/ReaderApp-unsigned.ipa
          retention-days: 90
          if-no-files-found: error
